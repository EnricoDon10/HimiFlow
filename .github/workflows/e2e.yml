name: HimiFlow Browser E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright kritische Flows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm 11 verwenden
        run: npm install --global npm@11.16.0

      - name: Frontend-Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Chromium installieren
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Isolierte E2E-Suite ausführen
        working-directory: frontend
        env:
          HIMIFLOW_E2E_START_SERVERS: '1'
        run: npm run e2e

      - name: Playwright-Artefakte bei Fehlern hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
          if-no-files-found: ignore
