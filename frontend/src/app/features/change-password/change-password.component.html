<div class="change-password-page">
  <section class="change-password-card">
    <div class="change-password-header">
      <p>Erstlogin erforderlich</p>
      <h1>Persönliches Passwort vergeben</h1>
      <span>
        Das temporäre Passwort ist nur für die erste Anmeldung bestimmt. Vergib jetzt dein persönliches Passwort.
      </span>
    </div>

    <form (ngSubmit)="changePassword()" class="change-password-form">
      <label>
        Aktuelles temporäres Passwort
        <span class="password-field">
          <input
            name="currentPassword"
            [type]="isPasswordVisible('current') ? 'text' : 'password'"
            [(ngModel)]="currentPassword"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="isPasswordVisible('current') ? 'Passwort ausblenden' : 'Passwort anzeigen (Klick oder gedrückt halten)'"
            [attr.aria-pressed]="isPasswordVisible('current')"
            (pointerdown)="beginPasswordPress('current', $event)"
            (pointerup)="endPasswordPress('current')"
            (pointerleave)="endPasswordPress('current')"
            (pointercancel)="endPasswordPress('current')"
            (keydown.enter)="togglePasswordFromKeyboard('current', $event)"
            (keydown.space)="togglePasswordFromKeyboard('current', $event)"
            (click)="togglePassword('current')"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
              <circle cx="12" cy="12" r="2.5" />
            </svg>
          </button>
        </span>
      </label>

      <label>
        Neues persönliches Passwort
        <span class="password-field">
          <input
            name="newPassword"
            [type]="isPasswordVisible('new') ? 'text' : 'password'"
            [(ngModel)]="newPassword"
            minlength="14"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="isPasswordVisible('new') ? 'Passwort ausblenden' : 'Passwort anzeigen (Klick oder gedrückt halten)'"
            [attr.aria-pressed]="isPasswordVisible('new')"
            (pointerdown)="beginPasswordPress('new', $event)"
            (pointerup)="endPasswordPress('new')"
            (pointerleave)="endPasswordPress('new')"
            (pointercancel)="endPasswordPress('new')"
            (keydown.enter)="togglePasswordFromKeyboard('new', $event)"
            (keydown.space)="togglePasswordFromKeyboard('new', $event)"
            (click)="togglePassword('new')"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
              <circle cx="12" cy="12" r="2.5" />
            </svg>
          </button>
        </span>
      </label>

      <label>
        Neues Passwort bestätigen
        <span class="password-field">
          <input
            name="confirmPassword"
            [type]="isPasswordVisible('confirm') ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            minlength="14"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="isPasswordVisible('confirm') ? 'Passwort ausblenden' : 'Passwort anzeigen (Klick oder gedrückt halten)'"
            [attr.aria-pressed]="isPasswordVisible('confirm')"
            (pointerdown)="beginPasswordPress('confirm', $event)"
            (pointerup)="endPasswordPress('confirm')"
            (pointerleave)="endPasswordPress('confirm')"
            (pointercancel)="endPasswordPress('confirm')"
            (keydown.enter)="togglePasswordFromKeyboard('confirm', $event)"
            (keydown.space)="togglePasswordFromKeyboard('confirm', $event)"
            (click)="togglePassword('confirm')"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
              <circle cx="12" cy="12" r="2.5" />
            </svg>
          </button>
        </span>
      </label>

      <p class="password-hint">
        Mindestens 14 Zeichen sowie Großbuchstaben, Kleinbuchstaben, Ziffern und Sonderzeichen.
      </p>

      @if (errorMessage()) {
        <div class="error-message" role="alert">{{ errorMessage() }}</div>
      }

      <button type="submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Passwort wird gespeichert...' : 'Passwort speichern' }}
      </button>
    </form>
  </section>
</div>
