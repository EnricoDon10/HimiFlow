<div class="login-page">
  <section class="login-card">
    <div class="login-header">
      <h1>Einsparungsdatenbank</h1>
      <p>Bitte melden Sie sich mit Ihrem Benutzer an.</p>
    </div>

    <form (ngSubmit)="login()" class="login-form">
      <label>
        Benutzername
        <input
          name="userName"
          type="text"
          [(ngModel)]="userName"
          autocomplete="username"
        />
      </label>

      <label>
        Passwort
        <span class="password-field">
          <input
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="showPassword ? 'Passwort ausblenden' : 'Passwort anzeigen (Klick oder gedrückt halten)'"
            [attr.aria-pressed]="showPassword"
            (pointerdown)="beginPasswordPress($event)"
            (pointerup)="endPasswordPress()"
            (pointerleave)="endPasswordPress()"
            (pointercancel)="endPasswordPress()"
            (keydown.enter)="togglePasswordFromKeyboard($event)"
            (keydown.space)="togglePasswordFromKeyboard($event)"
            (click)="togglePassword()"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
              <circle cx="12" cy="12" r="2.5" />
            </svg>
          </button>
        </span>
      </label>

      @if (errorMessage()) {
        <div class="error-message">
          {{ errorMessage() }}
        </div>
      }

      <button type="submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Anmeldung läuft...' : 'Anmelden' }}
      </button>
    </form>
  </section>
</div>
